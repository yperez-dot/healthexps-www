.life-calc-inputs-grid {

}
.life-situation-title { font-weight: 700; font-size: 15.5px; color: var(--black); margin-bottom: 8px; }

.life-rule-card {

  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* TRUST STRIP */
.life-trust-section { background: #fff; padding: 48px 56px; }
.life-trust-inner {
  max-width: 1160px; margin: 0 auto;
  display: flex; justify-content: space-around; flex-wrap: wrap;

}

/* FAQ */
.life-faq-section { background: #fdfaf7; padding: 56px 56px; }
.life-faq-inner { max-width: 780px; margin: 0 auto; }

.life-faq-a {

.life-form-title {

.life-form-sub {

}
.life-form-name-grid {

  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.life-form-section select,
.life-form-section input[type="text"],
.life-form-section input[type="tel"],
.life-form-section input[type="email"],
.life-form-section textarea {

  padding: 13px 14px; border-radius: 10px;
  border: 2px solid #ddd2e6; font-size: 16px;
  font-family: var(--font-body); color: var(--black);

.life-form-section select:focus,
.life-form-section input:focus,

.life-form-section select { margin-bottom: 12px; }
.life-form-section input[type="tel"],
.life-form-section input[type="email"] {

.life-form-section textarea {

  border-radius: 9px; padding: 10px 14px;
  font-size: 13px; color: #dc2626; margin-bottom: 14px;
}
.life-form-success {
  display: none; text-align: center; padding: 28px 10px;
}
.life-form-success-check {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--purple);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
}
.life-form-success h3 {
  font-family: var(--font-head); font-size: 20px;
  margin: 0 0 8px; color: var(--black);
}
.life-form-success p { color: var(--gray-text); font-size: 14px; margin: 0; }

/* FINAL CTA BANNER */
.life-final-cta {
  background: linear-gradient(135deg, var(--purple) 0%, #5a2a86 100%);
  padding: 56px; text-align: center; color: #fff;
}
.life-final-cta h2 {
  font-family: var(--font-head); font-size: 26px;
  font-weight: 700; margin: 0 0 10px;
}
.life-final-cta p { font-size: 15px; opacity: .85; margin: 0 0 24px; }
.life-final-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.footer-wrap {
  background: #fff; color: var(--black);
  padding: 56px 56px 24px; border-top: 1px solid var(--gray-mid);
}
.footer-grid {
  max-width: 1160px; margin: 0 auto;
  display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr;
  gap: 32px; margin-bottom: 36px;
}
.footer-col-label {
  font-weight: 700; font-size: 12.5px; letter-spacing: .06em;
  margin-bottom: 14px; color: var(--purple);
}
.footer-links-col { display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; }
.footer-bottom {
  max-width: 1160px; margin: 0 auto;
  border-top: 1px solid var(--gray-mid); padding-top: 20px;
  font-size: 13px; color: #4a4051;
}
.footer-disclaimer {
  padding-top: 12px; font-size: 13.5px; color: #a79db2; line-height: 1.6;
}

  var form = document.getElementById('v4LeadForm');
  if (!form) return;

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn      = document.getElementById('v4Submit');
    var err      = document.getElementById('v4Error');
    var first    = (document.getElementById('v4First') || {}).value || '';
    var last     = (document.getElementById('v4Last') || {}).value || '';
    var phone    = (document.getElementById('v4Phone') || {}).value || '';
    var email    = (document.getElementById('v4Email') || {}).value || '';
    var coverage = (document.getElementById('v4Coverage') || {}).value || '';
    var consent  = document.getElementById('v4Consent') && document.getElementById('v4Consent').checked;

    first = first.trim(); last = last.trim(); phone = phone.trim(); email = email.trim();

    if (!first || !last || !phone || !email || !coverage || !consent) {
      err.style.display = 'block';
      err.textContent = 'Please fill in all required fields.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Sending...';
    err.style.display = 'none';

    try {
      var res = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          first_name: first,
          last_name: last,
          phone: phone,
          email: email,
          coverage_type: coverage,
          source: 'Homepage Form',
          page: window.location.href,
          submitted_at: new Date().toISOString()
        })
      });
      if (res.ok) {
        form.style.display = 'none';
        var success = document.getElementById('v4Success');
        if (success) success.style.display = 'block';
      } else { throw new Error('Server error'); }
    } catch(ex) {

      btn.textContent = 'Book My Free Consultation →';
      err.style.display = 'block';
      err.textContent = 'Something went wrong. Please try again or call 1-800-380-6821.';
    }
  });
})();
</script>

<script>
// V4 hamburger toggle
(function(){
  var btn = document.getElementById('v4HamburgerBtn');
  var closeBtn = document.getElementById('v4MobileClose');
  var menu = document.getElementById('v4-mobile-menu');
  if (!btn || !menu) return;
  function openMenu(){
    menu.classList.add('open');
    btn.setAttribute('aria-expanded','true');
    document.body.style.overflow='hidden';
  }
  function closeMenu(){
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
    document.body.style.overflow='';
  }
  btn.addEventListener('click', openMenu);
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  // Close on Escape
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMenu(); });
})();
</script>

<script>
// V4 nav mobile — hover for desktop, click for mobile
(function(){
  var navItems = document.querySelectorAll('.v4-nav-item');
  function isMobile(){ return window.innerWidth <= 900; }
  navItems.forEach(function(item){
    var drop = item.querySelector('.v4-nav-dropdown');
    if (!drop) return;
    // Desktop: CSS handles hover; Mobile: toggle on click
    item.addEventListener('click', function(e){
      if (!isMobile()) return;
      var open = drop.style.display === 'block';
      // Close all
      navItems.forEach(function(ni){ var d = ni.querySelector('.v4-nav-dropdown'); if(d) d.style.display=''; });
      drop.style.display = open ? '' : 'block';
    });
  });
  // Close on outside click
  document.addEventListener('click', function(e){
    if (!isMobile()) return;
    navItems.forEach(function(item){
      if (!item.contains(e.target)){
        var drop = item.querySelector('.v4-nav-dropdown');
        if(drop) drop.style.display='';
      }
    });
  });
})();
</script>

<script>
(function(){
  var s = document.getElementById('scrollToTop');
  if (!s) return;
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('scroll', function(){
    s.style.display = window.pageYOffset > 300 ? 'flex' : 'none';
  });
  s.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: prefersReduced ? 'instant' : 'smooth' });
  });
})();
</script>
